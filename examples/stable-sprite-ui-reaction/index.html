<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, height=720">
  <title>Stable sprite, delayed UI reaction</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #07151a; color: #e9fff2; font-family: system-ui, sans-serif; }
    #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .clip { position: absolute; inset: 0; overflow: hidden; }
    .world { position: absolute; inset: 0; background: radial-gradient(circle at 55% 38%, #173b38, #07151a 70%); }
    .frame { position: absolute; inset: 28px; border: 3px solid #3a987b; pointer-events: none; }
    h1 { position: absolute; left: 84px; top: 67px; margin: 0; font-size: 47px; letter-spacing: .01em; }
    .sub { position: absolute; left: 85px; top: 130px; margin: 0; color: #b8d8cd; font-size: 23px; }
    .stage { position: absolute; left: 76px; right: 76px; top: 215px; bottom: 88px; border: 3px solid #276654; background: #092124; }
    .floor { position: absolute; left: 105px; bottom: 145px; width: 450px; height: 12px; background: #3dba83; }
    .actor { position: absolute; left: 190px; top: 296px; width: 170px; height: 215px; }
    .body { position: absolute; inset: 0; transform-origin: 50% 100%; }
    .sprite { position: absolute; left: 18px; top: 11px; width: 134px; height: 180px; border: 5px solid #061e1a; border-radius: 35% 35% 27% 27%; background: #6df1aa; box-shadow: inset -15px -12px 0 #3acb8a, 8px 8px 0 #051b18; }
    .eyes { position: absolute; top: 60px; left: 33px; width: 15px; height: 22px; border-radius: 50%; background: #092722; box-shadow: 48px 0 0 #092722; }
    .mouth { position: absolute; top: 105px; left: 59px; width: 24px; height: 9px; border: 4px solid #092722; border-top: 0; border-radius: 0 0 20px 20px; }
    .feet { position: absolute; left: 19px; bottom: 0; width: 55px; height: 23px; border-radius: 8px; background: #287c63; box-shadow: 78px 0 0 #287c63; }
    .panel { position: absolute; top: 290px; right: 145px; width: 460px; height: 215px; padding: 29px; border: 5px solid #498a7a; background: #102b30; transform-origin: 50% 50%; }
    .panel-label { margin: 0; color: #b6ddcd; font-size: 24px; font-weight: 700; letter-spacing: .12em; }
    .status { position: relative; height: 65px; margin-top: 30px; font-size: 47px; font-weight: 900; }
    .status span { position: absolute; inset: 0; }
    #approved { opacity: 0; color: #8bffc0; }
    .note { position: absolute; left: 80px; bottom: 52px; margin: 0; color: #b6ddcd; font-size: 22px; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="stable-sprite-demo" data-start="0" data-width="1280" data-height="720" data-duration="6">
      <div class="world"></div><div class="frame"></div>
      <h1>ONE CHARACTER, ONE CONTINUOUS BODY</h1>
      <p class="sub">Anticipation → action → settle. Character action → UI response.</p>
      <div class="stage"></div><div class="floor"></div>
      <div id="actor" class="actor" aria-label="Geometric character">
        <div id="body" class="body"><div class="sprite"><div class="eyes"></div><div class="mouth"></div></div><div class="feet"></div></div>
      </div>
      <div id="panel" class="panel">
        <p class="panel-label">REVIEW STATUS</p>
        <div class="status"><span id="pending">PENDING</span><span id="approved">APPROVED</span></div>
      </div>
      <p class="note">The panel responds 120 ms after the character leans.</p>
  </div>
  <script>
    // One paused, seekable timeline. The geometric character never swaps drawings.
    const tl = gsap.timeline({ paused: true });
    tl.fromTo('#body', { y: 0, rotation: 0 }, { y: -4, rotation: -1, duration: .4, ease: 'sine.out', immediateRender: false }, .5);
    tl.to('#body', { y: 0, rotation: 0, duration: .4, ease: 'sine.inOut' }, .9);
    // Anticipation, jump, landing compression, settle.
    tl.to('#body', { y: 9, scaleX: 1.04, scaleY: .94, duration: .13, ease: 'power1.out' }, 1.6);
    tl.to('#body', { y: -66, scaleX: .98, scaleY: 1.03, duration: .22, ease: 'power2.out' }, 1.73);
    tl.to('#body', { y: 8, scaleX: 1.06, scaleY: .92, duration: .19, ease: 'power2.in' }, 1.95);
    tl.to('#body', { y: 0, scaleX: 1, scaleY: 1, duration: .24, ease: 'power2.out' }, 2.14);
    // The lean starts at 3.15 s; the panel responds at 3.27 s.
    tl.to('#body', { rotation: 7, x: 17, duration: .18, ease: 'power2.out' }, 3.15);
    tl.to('#panel', { scale: 1.035, borderColor: '#8bffc0', duration: .18, ease: 'power2.out' }, 3.27);
    tl.set('#pending', { opacity: 0 }, 3.27);
    tl.set('#approved', { opacity: 1 }, 3.27);
    tl.to('#body', { rotation: 0, x: 0, duration: .22, ease: 'power2.out' }, 3.48);
    tl.to('#panel', { scale: 1, duration: .25, ease: 'power2.out' }, 3.53);
    window.__timelines['stable-sprite-demo'] = tl;
  </script>
</body>
</html>
